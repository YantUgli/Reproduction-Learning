[project]
name = "reproduction-learning-engine"
version = "0.1.0"
description = "Reproduction Learning Engine — backend (M0 scaffolding)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic>=2",
    "pyyaml>=6",
    # Scheduler spaced repetition (M4). JANGAN tulis algoritma SR sendiri —
    # CLAUDE.md §2 / PRD §7.5.
    "fsrs>=6,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` di argument default adalah idiom resmi FastAPI (bukan bug B008).
"app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
