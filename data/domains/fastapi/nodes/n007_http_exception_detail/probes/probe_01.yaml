question: Handler memanggil `raise HTTPException(status_code=409, detail="account
  already exists")`. Bentuk body JSON responsnya?
options:
- '{"error": "account already exists"}'
- '{"detail": "account already exists"}'
- '{"message": "account already exists"}'
