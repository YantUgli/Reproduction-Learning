correct_answer: '[30, 40]'
snippet: |
  def paginate(items, page, per_page):
      if page < 1 or per_page < 1:
          raise ValueError("page dan per_page harus >= 1")
      start = (page - 1) * per_page
      return list(items)[start : start + per_page]
