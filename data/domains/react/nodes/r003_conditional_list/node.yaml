status_default: locked
source_refs: [react_docs_rendering_lists, react_docs_conditional_rendering]
signature_contract: "{items.length === 0 ? <p>…</p> : <ul>{items.map((it) => <li key={…}>…</li>)}</ul>}"
scaffold_level: L2
