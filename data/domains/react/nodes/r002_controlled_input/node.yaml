id: r002_controlled_input
domain_id: react
concept: "Input terkendali: value dari state, onChange menyetel state"
description: >
  Input terkendali adalah dasar semua form React: nilai yang tampil SELALU berasal
  dari state, dan satu-satunya jalan mengubahnya adalah handler. Diuji lewat mengetik
  sungguhan di DOM.
