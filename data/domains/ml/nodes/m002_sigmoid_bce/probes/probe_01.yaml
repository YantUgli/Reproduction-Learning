id: m002_probe_01
node_id: m002_sigmoid_bce
type: spot_bug
question: 'BCE ditulis tanpa clipping: `-np.mean(y*np.log(p) + (1-y)*np.log(1-p))`.
  Apa hasilnya bila ada elemen p tepat 1.0 dengan y = 0?'
options:
- inf — log(1 - 1.0) = log(0) = -inf
- 0.0 — sukunya hilang karena dikalikan nol
- nan — pembagian nol dengan nol
- Nilai berhingga yang sedikit terlalu besar
correct_answer: inf — log(1 - 1.0) = log(0) = -inf
snippet: |
  import numpy as np


  def bce_tanpa_clip(y, p):
      y = np.asarray(y, dtype=float)
      p = np.asarray(p, dtype=float)
      with np.errstate(divide="ignore", invalid="ignore"):
          return -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))


  hasil = bce_tanpa_clip([0.0], [1.0])
expression: bool(np.isinf(hasil))
expected_value: 'True'
