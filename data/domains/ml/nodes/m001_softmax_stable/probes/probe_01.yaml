id: m001_probe_01
node_id: m001_softmax_stable
type: predict_output
question: 'softmax ditulis TANPA mengurangi maksimum: `np.exp(x) / np.sum(np.exp(x))`.
  Apa hasilnya untuk x = [1000, 1001, 1002]?'
options:
- '[nan, nan, nan] — np.exp meluap jadi inf, lalu inf/inf'
- '[0.09, 0.24, 0.67] — sama saja, hasilnya benar'
- '[0.0, 0.0, 1.0] — pembulatan ke nol'
- Python melempar OverflowError
correct_answer: '[nan, nan, nan] — np.exp meluap jadi inf, lalu inf/inf'
snippet: |
  import numpy as np


  def softmax_naif(x):
      # Sengaja TANPA mengurangi maksimum.
      with np.errstate(over="ignore", invalid="ignore"):
          e = np.exp(np.asarray(x, dtype=float))
          return e / np.sum(e)


  hasil = softmax_naif([1000.0, 1001.0, 1002.0])
expression: bool(np.isnan(hasil).all())
expected_value: 'True'
